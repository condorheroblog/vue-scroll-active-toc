<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Vue Scroll Active TOC sharing card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="55%" stop-color="#0e1a2b" />
      <stop offset="100%" stop-color="#0a2318" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42d392" />
      <stop offset="100%" stop-color="#35a86e" />
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#9ff0c8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.75">
      <stop offset="0%" stop-color="#42b883" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#42b883" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#42b883" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Logo mark -->
  <g transform="translate(96 132)">
    <rect width="140" height="140" rx="34" fill="url(#logoGrad)" />
    <rect x="50" y="36" width="58" height="10" rx="5" fill="#ffffff" opacity="0.55" />
    <rect x="50" y="66" width="66" height="10" rx="5" fill="#ffffff" />
    <rect x="50" y="96" height="48" width="0" />
    <rect x="50" y="96" width="46" height="10" rx="5" fill="#ffffff" opacity="0.55" />
    <rect x="30" y="62" width="10" height="18" rx="5" fill="#0b3d2e" />
  </g>

  <!-- Wordmark -->
  <text x="268" y="216" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="750" fill="url(#word)">Vue Scroll Active TOC</text>
  <text x="270" y="282" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" font-weight="500" fill="#42d392">vue-scroll-active-toc</text>

  <!-- Tagline -->
  <text x="98" y="392" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#e2e8f0">Scroll-spy table of contents for Vue 3 — highlight the right link</text>
  <text x="98" y="440" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="500" fill="#e2e8f0">at any scroll speed, in the window or any container.</text>
  <text x="98" y="502" font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="26" font-weight="400" fill="#94a3b8">滚动高亮目录 · 响应式配置 · 平滑滚动 · 暗色模式 · 中英文切换</text>

  <!-- Footer chips -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#9ff0c8">
    <rect x="98" y="540" width="132" height="40" rx="20" fill="#42b883" fill-opacity="0.12" stroke="#42b883" stroke-opacity="0.45" />
    <text x="164" y="567" text-anchor="middle">Vue 3</text>
    <rect x="246" y="540" width="118" height="40" rx="20" fill="#42b883" fill-opacity="0.12" stroke="#42b883" stroke-opacity="0.45" />
    <text x="305" y="567" text-anchor="middle">Vite</text>
    <rect x="380" y="540" width="220" height="40" rx="20" fill="#42b883" fill-opacity="0.12" stroke="#42b883" stroke-opacity="0.45" />
    <text x="490" y="567" text-anchor="middle">Tailwind CSS 4</text>
  </g>
  <text x="1102" y="576" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="20" fill="#64748b">github.com/condorheroblog/vue-scroll-active-toc</text>
</svg>
